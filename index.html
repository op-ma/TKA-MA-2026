<style>
html{font-size:14px}
body{font-family:'Source Sans 3',system-ui,sans-serif;font-style:normal;-webkit-font-smoothing:antialiased}
*,em,i,cite,address{font-style:normal}
.btn{padding:.4rem .85rem;border-radius:.6rem;font-weight:600;font-size:.8rem;background:#12855f;color:#fff;transition:background .15s}
.btn:hover{background:#0f6b4f}.btn.au{background:#f0c24b;color:#4a3a00}.btn.au:hover{background:#e3b232}.btn.o{background:#fff;color:#12855f;border:1px solid #9fd3bd}.btn.o:hover{background:#eaf7f1}
.btn.r{background:#fff;color:#c0392b;border:1px solid #efb3ab}
body input,body select,body textarea{border:1px solid #cfe3d8;border-radius:.6rem;padding:.42rem .75rem;font-size:.84rem;line-height:1.3;background:#fff}
body select{padding-right:1.9rem}
body input::placeholder,body textarea::placeholder{color:#8fb0a1}
input:focus,select:focus,textarea:focus{outline:2px solid #bfe6d2;border-color:#12855f}
.tw{overflow:auto;max-height:calc(100vh - 220px)}
th{position:sticky;top:0;z-index:2;background:#e4f4ec;color:#0f5a41;text-align:left;font-weight:700;padding:.5rem .65rem;font-size:.74rem;white-space:nowrap;border-bottom:2px solid #bfe3d1;vertical-align:middle;line-height:1.3}
td{padding:.4rem .65rem;border-bottom:1px solid #e6f1ea;font-size:.86rem;vertical-align:middle;line-height:1.35;font-variant-numeric:tabular-nums}
tr:nth-child(even) td{background:#f8fcfa}
tr:hover td{background:#effaf4}
h1,h2,h3{letter-spacing:-.01em}
.tok{font-family:ui-monospace,monospace;letter-spacing:.2em}
.ph{display:none}
.cdn{font-variant-numeric:tabular-nums;font-weight:700}
#dashWrap:fullscreen{background:#f4fbf7;padding:2rem;overflow:auto}
@media print{.tw{max-height:none!important;overflow:visible!important}.noprint{display:none!important}.ph{display:block}body{background:#fff}th{background:#ddd!important;color:#000!important;-webkit-print-color-adjust:exact}td{font-size:10pt}.sig td{height:42px}}

const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={t:localStorage.tka_t,me:JSON.parse(localStorage.tka_me||'null'),v:'dashboard',f:{},d:null,dn:{},tm:null,ed:{}};
const NAV=[['dashboard','Dashboard'],['peserta','Peserta'],['jadwal','Jadwal'],['ujian','Jadwal Ujian'],['denah','Denah'],['token','Token'],['catatan','Catatan'],['petugas','Petugas'],['hadir','Daftar hadir'],['users','Pengguna']];
const own=l=>S.me.role==='admin'||(S.me.role==='pj'&&String(S.me.labkom||'').split(/[,;]/).map(x=>x.trim().toUpperCase()).includes(String(l).trim().toUpperCase()));
const labkoms=()=>[...new Set(S.d.peserta.map(p=>p.labkom))].sort();
const uniq=k=>[...new Set(S.d.peserta.map(p=>p[k]))].sort();
const opt=(a,v,all)=>(all?`<option value="">${all}</option>`:'')+a.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2500)}
async function api(a,d,rf){const r=await fetch(API,{method:'POST',body:JSON.stringify({a,t:S.t,d,r:rf})});const j=await r.json();if(!j.ok){if(j.auth)logout();throw new Error(j.error)}return j}
const PARTS={save_peserta:['peserta'],del_peserta:['peserta'],save_token:['token'],del_token:['token'],add_catatan:['catatan'],edit_catatan:['catatan'],del_catatan:['catatan'],save_petugas:['petugas'],del_petugas:['petugas','hadir'],save_hadir:['hadir'],del_hadir:['hadir'],save_denah:['denah'],del_denah:['denah'],save_user:['users'],del_user:['users'],save_jadwal:['jadwal'],del_jadwal:['jadwal'],bulk_jadwal:['jadwal'],clear_jadwal:['jadwal']};
const cacheD=()=>{try{sessionStorage.tka_d=JSON.stringify(S.d)}catch{}};
async function act(a,d,msg){toast('Menyimpan…');try{const j=await api(a,d,PARTS[a]);delete j.ok;Object.assign(S.d,j);upP(S.d);cacheD();draw();toast(msg||'Tersimpan')}catch(e){alert(e.message)}}
function logout(){localStorage.removeItem('tka_t');sessionStorage.removeItem('tka_d');S.t=null;S.d=null;clearInterval(S.tm);draw()}
async function login(e){e.preventDefault();
 try{const r=await fetch(API,{method:'POST',body:JSON.stringify({a:'login',u:$('#u').value.trim(),p:$('#p').value})});const j=await r.json();if(!j.ok)throw new Error(j.error);
 S.t=j.t;S.me=j.me;localStorage.tka_t=j.t;localStorage.tka_me=JSON.stringify(j.me);await load()}catch(x){$('#err').textContent=x.message}}
const pad2=x=>String(x).padStart(2,'0');
function nDate(v){if(v==null)return'';v=String(v).trim();let m;
 if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;
 if(/^\d{4}-\d{2}-\d{2}T/.test(v)){const d=new Date(v);if(!isNaN(d))return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
 m=v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/);if(m)return `${m[3]}-${pad2(m[2])}-${pad2(m[1])}`;
 return v}
function nTime(v){if(v==null)return'';if(typeof v=='number'&&v>=0&&v<1){const t=Math.round(v*1440);return pad2(Math.floor(t/60)%24)+':'+pad2(t%60)}
 v=String(v).trim();let m=v.match(/^(\d{1,2})[:.](\d{2})(?::\d{2})?(?:\s*[AP]M)?$/i);if(m)return pad2(m[1])+':'+m[2];
 if(/^\d{4}-\d{2}-\d{2}T/.test(v)){const d=new Date(v);if(!isNaN(d)){const t=Math.round((d.getHours()*3600+d.getMinutes()*60+d.getSeconds())/60);return pad2(Math.floor(t/60)%24)+':'+pad2(t%60)}}
 return v}
const nj=j=>({...j,tanggal:nDate(j.tanggal),mulai:nTime(j.mulai),selesai:nTime(j.selesai),gel:String(j.gel??''),sesi:String(j.sesi??''),tes:String(j.tes??''),mapel:String(j.mapel??'')});

const tokBox=(c,l,z)=>c?`<div class="tk mt-2 rounded-lg px-3 py-1.5 text-xs font-semibold" data-z="${z||''}" data-l="${esc(l)}"></div>`:'';
function tkTick(){if(!S.d||!S.d.token)return;document.querySelectorAll('.tk').forEach(e=>{const l=e.dataset.l,c=tokCur(l);if(!c)return;const{left,s}=tokSt(c,l);let t,k;
 if(s=='exp'){t=`⛔ Token sudah lebih dari 15 menit (lewat ${fmtD(-left)}) — GANTI SEKARANG`;k='bg-red-600 text-white animate-pulse'}
 else if(s=='warn'){t=`⚠ Segera ganti token · sisa ${fmtD(left)}`;k='bg-au text-ink animate-pulse'}
 else if(s=='ok'){t=`Token berlaku · ganti dalam ${fmtD(left)}`;k='bg-g1 text-g9'}
 else{t='Tidak ada ujian berlangsung';k='bg-g0 text-g6'}
 e.textContent=t;e.className='tk mt-2 rounded-lg px-3 py-1.5 font-semibold '+(e.dataset.z||'text-xs')+' '+k})}
let AC;
function beep(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();[0,.3,.6].forEach(t=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;g.gain.value=.2;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.18)})}catch{}}
const TA={st:{},at:{},n:0,h:''};
function tokWatch(){const A=$('#tokAlert');if(!A)return;
 if(!S.t||!S.d||!S.d.token||!S.me){if(TA.h){A.innerHTML='';TA.h=''}return}
 if(++TA.n%15==0&&S.v!='token'&&S.v!='dashboard')api('token').then(j=>{S.d.token=j.token}).catch(()=>{});
 const bad=[],now=Date.now();
 for(const l of labkoms()){if(!(S.me.role=='viewer'||own(l)))continue;const c=tokCur(l);if(!c){delete TA.st[l];continue}const{s}=tokSt(c,l),p=TA.st[l];
  if(s=='warn'||s=='exp'){bad.push({l,s});
   if(p!=s||(s=='exp'&&now-(TA.at[l]||0)>=60000)){TA.at[l]=now;beep();const m=s=='exp'?`Token ${l} sudah 15 menit — segera ganti!`:`Token ${l} segera kedaluwarsa — siapkan token baru`;toast(m);
    try{if(window.Notification&&Notification.permission=='granted')new Notification('Ganti token TKA',{body:m})}catch{}}}
  TA.st[l]=s}
 let h='';
 if(bad.length){const ex=bad.some(x=>x.s=='exp');
  h=`<div class="${ex?'bg-red-600 text-white':'bg-au text-ink'} px-4 py-2 flex flex-wrap items-center justify-between gap-2 shadow-lg"><div class="text-sm font-bold ${ex?'animate-pulse':''}">${ex?'⛔':'⚠'} ${bad.map(x=>esc(x.l)+(x.s=='exp'?': token sudah 15 menit, GANTI SEKARANG':': token segera kedaluwarsa (kurang dari 3 menit)')).join(' · ')}</div>${S.me.role!='viewer'&&S.v!='token'?`<button class="btn o" onclick="S.v='token';draw()">Buka halaman Token</button>`:''}</div>`}
 if(h!==TA.h){TA.h=h;A.innerHTML=h}}
document.addEventListener('click',()=>{try{if(window.Notification&&Notification.permission=='default')Notification.requestPermission();AC=AC||new(window.AudioContext||window.webkitAudioContext)()}catch{}},{once:true});
setInterval(tokWatch,1000);
function draw(){clearInterval(S.tm);clearInterval(S.cd);const A=$('#app');
 if(!S.t||!S.d){A.innerHTML=`<div class="min-h-screen grid place-items-center bg-gradient-to-br from-g9 to-g6 p-4"><form onsubmit="login(event)" class="bg-g0 rounded-2xl p-8 w-full max-w-sm border-2 border-au shadow-xl"><div class="font-d text-3xl font-bold text-g8">	TKA MA 2026</div><div class="text-sm text-g6 mb-5">
 <input id="u" class="w-full mb-3" placeholder="Username" autocomplete="username" required><input id="p" type="password" class="w-full mb-3" placeholder="Password" autocomplete="current-password" required><div id="err" class="text-red-700 text-sm mb-2"></div><button class="btn au w-full py-2">Masuk</button></form></div>`;
  if(S.t&&!S.d)load().catch(logout);return}
 const nav=NAV.filter(n=>n[0]!='users'||S.me.role=='admin');
 A.innerHTML=`<header class="noprint bg-gradient-to-r from-g9 to-g8 text-white shadow-md"><div class="w-full px-4 py-3 flex items-center justify-between"><div><div class="font-d text-xl text-au2 font-bold">TKA MA 2026</div><div class="text-xs opacity-80">${esc(S.me.nama)} · ${esc(S.me.role)}${S.me.labkom?' · '+esc(S.me.labkom):''}</div></div><div class="flex gap-2"><button class="btn o" onclick="load()">Muat ulang</button><button class="btn au" onclick="logout()">Keluar</button></div></div>
 <nav class="w-full px-4 flex gap-1 overflow-x-auto">${nav.map(n=>`<button onclick="S.v='${n[0]}';draw()" class="px-4 py-2 text-sm font-semibold rounded-t-lg ${S.v==n[0]?'bg-g0 text-g9':'text-white/85 hover:bg-white/15'}">${n[1]}</button>`).join('')}</nav></header>
 <main class="w-full p-4">${V[S.v]()}</main>`;
 if(S.v=='token'){tokDraw();S.tm=setInterval(tokPoll,5000)}if(S.v=='dashboard'){dashDraw();S.tm=setInterval(dashPoll,5000)}if(S.v=='dashboard'||S.v=='ujian'||S.v=='token'){tickCd();S.cd=setInterval(tickCd,1000)}}
try{if(S.t)S.d=upP(JSON.parse(sessionStorage.tka_d||'null'))}catch{}
draw();
if(S.t&&S.d)load().catch(()=>{});
</script></body></html>
